name: Bug report
description: Report a reproducible problem.
title: "[Bug]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command, page, or input that triggers the problem. Remove tokens and personal data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the relevant browser, editor, runtime, OS, and project version.
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Optional supporting details. Remove secrets before sharing.
