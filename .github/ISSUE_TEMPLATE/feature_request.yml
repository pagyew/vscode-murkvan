name: Feature request
description: Suggest a focused improvement.
title: "[Feature]: "
body:
  - type: textarea
    id: need
    attributes:
      label: What would this help you do?
      description: Describe the use case or the problem you want to solve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Include a concrete example of the desired behavior.
    validations:
      required: true
